name: Deploy bombpvp.com

on:
  push:
    branches:
      - main
    paths:
      - "online/**"
      - "game/**"
      - "champions/**"
      - "riftbomb.html"
      - "package.json"
      - ".github/workflows/deploy-bombpvp.yml"
  workflow_dispatch:

concurrency:
  group: deploy-bombpvp
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy Riftbomb Online
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: online
    permissions:
      contents: read
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: online/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build verified artifact
        run: npm run build

      - name: Deploy to Cloudflare Workers
        run: npm run deploy

      - name: Smoke-check production
        run: |
          set -euo pipefail
          curl -fsS -o /dev/null -w "homepage:%{http_code}\n" https://bombpvp.com/
          code="$(curl -fsS -X POST https://bombpvp.com/api/pvp \
            -H 'content-type: application/json' \
            -d '{}' || true)"
          echo "pvp:$code"
          echo "$code" | grep -q 'unknown_action'
