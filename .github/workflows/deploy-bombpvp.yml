name: Deploy bombpvp.com

on:
  push:
    branches:
      - main
    paths:
      - "online/**"
      - "game/**"
      - "champions/**"
      - "riftbomb.html"
      - "package.json"
      - ".github/workflows/deploy-bombpvp.yml"
  workflow_dispatch:

concurrency:
  group: deploy-bombpvp
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy Riftbomb Online
    # DEPLOY_WORKFLOW_MAIN_ONLY_V1 — workflow_dispatch on a non-main ref must not ship bombpvp.com.
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: online
    permissions:
      contents: read
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: online/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build verified artifact
        run: npm run build

      # DEPLOY_RELEASE_GATES_V1 — source-lock deploy + Oracle health + version pin before wrangler publish.
      - name: Release gates (deploy source locks)
        run: npm run test:release-gates

      - name: Deploy to Cloudflare Workers
        run: npm run deploy

      - name: Smoke-check production
        run: |
          set -euo pipefail
          curl -fsS -o /dev/null -w "homepage:%{http_code}\n" https://bombpvp.com/
          code="$(curl -fsS -X POST https://bombpvp.com/api/pvp \
            -H 'content-type: application/json' \
            -d '{}' || true)"
          echo "pvp:$code"
          echo "$code" | grep -q 'unknown_action'
          # DEPLOY_SMOKE_MANIFEST_V1 — package live must expose a fingerprinted partsPath.
          manifest="$(curl -fsS https://bombpvp.com/riftbomb-parts/manifest.json)"
          echo "manifest:$manifest"
          node --input-type=module -e '
            const m = JSON.parse(process.argv[1]);
            if (m.version !== 2) throw new Error(`manifest.version=${m.version}`);
            if (!m.sha256 || typeof m.sha256 !== "string") throw new Error("manifest.sha256 missing");
            if (m.partsPath !== `/riftbomb-parts/${m.sha256}`) {
              throw new Error(`partsPath mismatch: ${m.partsPath}`);
            }
            if (!(Number(m.partCount) > 0)) throw new Error(`partCount=${m.partCount}`);
            console.log(`manifest_ok sha=${m.sha256.slice(0, 12)} parts=${m.partCount}`);
          ' "$manifest"
