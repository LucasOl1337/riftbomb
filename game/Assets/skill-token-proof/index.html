<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Skill token proof — real ability art</title>
  <style>
    body { margin: 0; background: #0a0a0a; color: #eaeaea; font: 14px/1.4 Consolas, monospace; padding: 1.5rem; }
    h1 { font-size: 1rem; letter-spacing: 0.12em; text-transform: uppercase; color: #e61919; }
    p { max-width: 48rem; opacity: 0.75; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(7rem, 1fr)); gap: 1rem; margin-top: 1.5rem; }
    figure { margin: 0; text-align: center; }
    img { width: 6.5rem; height: 6.5rem; object-fit: contain; background: #141414; border: 1px solid #2a2a2a; border-radius: 50%; }
    figcaption { margin-top: 0.4rem; font-size: 0.7rem; letter-spacing: 0.08em; text-transform: uppercase; color: #888; }
  </style>
</head>
<body>
  <h1>// Skill token art proof</h1>
  <p>
    These are the real champion ability icons extracted from the game pack and used as the
    top face of the 3D skill coins (circular disc mesh + thick coin body + gold rims).
    In-game they sit on a pedestal, not as black rectangles.
  </p>
  <div class="grid" id="g"></div>
  <script>
    const champs = ["katarina", "zed", "renekton", "vladimir", "gangplank"];
    const slots = ["q", "w", "e", "r"];
    const g = document.getElementById("g");
    for (const c of champs) {
      for (const s of slots) {
        const fig = document.createElement("figure");
        const img = document.createElement("img");
        img.src = `${c}-${s}.png`;
        img.onerror = () => { img.src = `${c}-${s}.webp`; };
        img.alt = `${c} ${s}`;
        const cap = document.createElement("figcaption");
        cap.textContent = `${c} · ${s}`;
        fig.append(img, cap);
        g.append(fig);
      }
    }
  </script>
</body>
</html>
