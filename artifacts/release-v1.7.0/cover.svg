<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024" font-family="Bahnschrift Condensed, Arial Narrow, Segoe UI, sans-serif">
  <defs>
    <radialGradient id="riftGlow" cx="34%" cy="58%" r="52%">
      <stop offset="0%" stop-color="#8df2ea" stop-opacity="0.30"/>
      <stop offset="55%" stop-color="#0f2f34" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#05090c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fuseGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff0a8" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#f0c961" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ff8589" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bombShell" cx="36%" cy="30%" r="78%">
      <stop offset="0%" stop-color="#22333a"/>
      <stop offset="42%" stop-color="#0e1a20"/>
      <stop offset="100%" stop-color="#04080a"/>
    </radialGradient>
    <linearGradient id="alloyEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0d486"/>
      <stop offset="52%" stop-color="#d8b96e"/>
      <stop offset="100%" stop-color="#7d6a3d"/>
    </linearGradient>
    <linearGradient id="plateFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1a20"/>
      <stop offset="100%" stop-color="#071015"/>
    </linearGradient>
    <linearGradient id="horizon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#05090c" stop-opacity="0"/>
      <stop offset="100%" stop-color="#05090c" stop-opacity="0.92"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8df2ea" stop-opacity="0"/>
      <stop offset="18%" stop-color="#8df2ea" stop-opacity="0.85"/>
      <stop offset="82%" stop-color="#8df2ea" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#8df2ea" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="frame">
      <path d="M0 0 H1502 L1536 34 V1024 H0 Z"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1536" height="1024" fill="#05090c"/>
    <rect width="1536" height="1024" fill="url(#riftGlow)"/>

    <!-- arena floor: receding grid -->
    <g stroke="#8df2ea" fill="none">
      <g opacity="0.16" stroke-width="1.4">
        <path d="M-460 1024 L560 566"/><path d="M-190 1024 L628 566"/><path d="M80 1024 L696 566"/>
        <path d="M350 1024 L764 566"/><path d="M620 1024 L832 566"/><path d="M890 1024 L900 566"/>
        <path d="M1160 1024 L968 566"/><path d="M1430 1024 L1036 566"/><path d="M1700 1024 L1104 566"/>
        <path d="M1970 1024 L1172 566"/>
      </g>
      <g opacity="0.20">
        <path d="M-460 1024 H1990" stroke-width="2.2"/>
        <path d="M-300 916 H1900" stroke-width="1.9"/>
        <path d="M-180 830 H1830" stroke-width="1.7"/>
        <path d="M-92 762 H1770" stroke-width="1.5"/>
        <path d="M-24 708 H1720" stroke-width="1.3"/>
        <path d="M28 666 H1680" stroke-width="1.15"/>
        <path d="M70 632 H1650" stroke-width="1"/>
        <path d="M104 604 H1620" stroke-width="0.9"/>
        <path d="M132 582 H1600" stroke-width="0.8"/>
        <path d="M156 566 H1580" stroke-width="0.7"/>
      </g>
    </g>

    <!-- horizon haze -->
    <rect x="0" y="452" width="1536" height="230" fill="url(#horizon)" opacity="0.55" transform="translate(0,-100)"/>
    <rect x="0" y="470" width="1536" height="120" fill="#05090c" opacity="0.35"/>

    <!-- alloy detonation ring on the floor -->
    <g transform="translate(392 742) scale(1 0.38)" fill="none">
      <circle r="252" stroke="#d8b96e" stroke-opacity="0.24" stroke-width="3"/>
      <circle r="176" stroke="#d8b96e" stroke-opacity="0.34" stroke-width="2.2"/>
      <circle r="104" stroke="#8df2ea" stroke-opacity="0.40" stroke-width="1.8"/>
    </g>

    <!-- the bomb -->
    <g transform="translate(392 668)">
      <ellipse cx="6" cy="122" rx="150" ry="34" fill="#02060a" opacity="0.72"/>
      <circle r="102" fill="url(#fuseGlow)" opacity="0.30" transform="translate(0 -6) scale(1.9)"/>
      <circle r="96" fill="url(#bombShell)"/>
      <circle r="96" fill="none" stroke="#d8b96e" stroke-opacity="0.42" stroke-width="2.4"/>
      <path d="M-58 -58 A96 96 0 0 1 6 -92" fill="none" stroke="#c4d1d3" stroke-opacity="0.34" stroke-width="7" stroke-linecap="round"/>
      <rect x="-21" y="-116" width="42" height="26" rx="5" fill="#141f25" stroke="url(#alloyEdge)" stroke-width="2.4"/>
      <path d="M0 -116 C 18 -146, -22 -164, 2 -196" fill="none" stroke="#d8b96e" stroke-width="5" stroke-linecap="round"/>
      <circle cx="2" cy="-198" r="34" fill="url(#fuseGlow)"/>
      <circle cx="2" cy="-198" r="7" fill="#fff0a8"/>
      <circle cx="30" cy="18" r="12" fill="#ff8589" opacity="0.55"/>
      <circle cx="30" cy="18" r="5" fill="#ff8589"/>
    </g>

    <!-- boot chain: three content-addressed links -->
    <g transform="translate(830 300)">
      <path d="M0 -66 H556 L582 -40 V632 H0 Z" fill="#040a0d" fill-opacity="0.72" stroke="#bfe0e4" stroke-opacity="0.17"/>
      <rect x="0" y="-66" width="200" height="3" fill="url(#scan)" opacity="0.9"/>
      <text x="26" y="-28" font-size="23" letter-spacing="4.6" fill="#8df2ea" fill-opacity="0.92">PUBLISHED BOOT CHAIN</text>
      <text x="26" y="6" font-size="19" letter-spacing="2.2" fill="#91a8ad" font-family="Consolas, Cascadia Mono, monospace">sha-256 per link · directly executable · immutable</text>

      <g font-family="Consolas, Cascadia Mono, monospace">
        <!-- link 1 -->
        <g transform="translate(26 44)">
          <path d="M0 0 H520 L540 20 V132 H0 Z" fill="url(#plateFill)" stroke="url(#alloyEdge)" stroke-width="2"/>
          <rect x="0" y="0" width="5" height="132" fill="#8df2ea" opacity="0.75"/>
          <text x="26" y="42" font-size="27" fill="#f1f6f6" font-family="Bahnschrift Condensed, Arial Narrow, sans-serif" letter-spacing="1.4">riftbomb-loader</text>
          <text x="26" y="76" font-size="17" fill="#d8b96e" letter-spacing="1.1">3323b9d6 2d5976fe fe3086f9 5e0e55cb</text>
          <text x="26" y="106" font-size="16" fill="#86e8a4" letter-spacing="0.8">✓ parses · immutable · 1 year</text>
          <text x="430" y="106" font-size="15" fill="#91a8ad">link 1/3</text>
        </g>
        <path d="M286 176 V206" stroke="#d8b96e" stroke-width="3" stroke-opacity="0.7"/>
        <path d="M278 200 L286 210 L294 200" fill="none" stroke="#d8b96e" stroke-width="3" stroke-opacity="0.7"/>

        <!-- link 2 -->
        <g transform="translate(26 216)">
          <path d="M0 0 H520 L540 20 V132 H0 Z" fill="url(#plateFill)" stroke="url(#alloyEdge)" stroke-width="2"/>
          <rect x="0" y="0" width="5" height="132" fill="#8df2ea" opacity="0.75"/>
          <text x="26" y="42" font-size="27" fill="#f1f6f6" font-family="Bahnschrift Condensed, Arial Narrow, sans-serif" letter-spacing="1.4">online-duel-loader</text>
          <text x="26" y="76" font-size="17" fill="#d8b96e" letter-spacing="1.1">8f8e0114 a1fc415f 9548679a 691cfbbc</text>
          <text x="26" y="106" font-size="16" fill="#86e8a4" letter-spacing="0.8">✓ parses · immutable · 1 year</text>
          <text x="430" y="106" font-size="15" fill="#91a8ad">link 2/3</text>
        </g>
        <path d="M286 348 V378" stroke="#d8b96e" stroke-width="3" stroke-opacity="0.7"/>
        <path d="M278 372 L286 382 L294 372" fill="none" stroke="#d8b96e" stroke-width="3" stroke-opacity="0.7"/>

        <!-- link 3 -->
        <g transform="translate(26 388)">
          <path d="M0 0 H520 L540 20 V132 H0 Z" fill="url(#plateFill)" stroke="url(#alloyEdge)" stroke-width="2"/>
          <rect x="0" y="0" width="5" height="132" fill="#8df2ea" opacity="0.75"/>
          <text x="26" y="42" font-size="27" fill="#f1f6f6" font-family="Bahnschrift Condensed, Arial Narrow, sans-serif" letter-spacing="1.4">online-duel</text>
          <text x="26" y="76" font-size="17" fill="#d8b96e" letter-spacing="1.1">8cfab442 4f18bc54 01bfbe5e 13232258</text>
          <text x="26" y="106" font-size="16" fill="#86e8a4" letter-spacing="0.8">✓ parses · immutable · 1 year</text>
          <text x="430" y="106" font-size="15" fill="#91a8ad">link 3/3</text>
        </g>

        <text x="26" y="590" font-size="16" fill="#91a8ad" letter-spacing="0.6">Content-Encoding removed — no byte depends on the asset host.</text>
      </g>
    </g>

    <!-- title block -->
    <g transform="translate(96 128)">
      <rect x="0" y="-52" width="132" height="4" fill="#d8b96e"/>
      <text x="0" y="16" font-size="86" letter-spacing="7" fill="#f1f6f6">RIFTBOMB</text>
      <text x="0" y="92" font-size="58" letter-spacing="12" fill="#8df2ea">v1.7.0</text>
      <text x="0" y="140" font-size="27" letter-spacing="2.6" fill="#c4d1d3">Content-addressed delivery</text>
      <text x="0" y="176" font-size="20" letter-spacing="1.4" fill="#91a8ad" font-family="Consolas, Cascadia Mono, monospace">bombpvp.com · manifest f0fbadad · 412 tests green</text>
    </g>

    <!-- bottom rule -->
    <g transform="translate(0 962)">
      <path d="M96 0 H1440" stroke="#bfe0e4" stroke-opacity="0.20" stroke-width="1.5"/>
      <text x="96" y="34" font-size="18" letter-spacing="3.4" fill="#91a8ad" font-family="Consolas, Cascadia Mono, monospace">ROOT 216 · ONLINE 121 · ORACLE 75</text>
      <text x="1440" y="34" font-size="18" letter-spacing="3.4" fill="#d8b96e" text-anchor="end" font-family="Consolas, Cascadia Mono, monospace">PATCH NOTES v1.7.0</text>
    </g>
  </g>
</svg>
